name: Compressed 464 validation
on:
  pull_request:
    paths:
      - 'src/match/league/**'
      - 'balance/plans/counters-compressed.json'
      - '.github/workflows/compressed-464-validation.yml'
permissions:
  contents: read
concurrency:
  group: compressed-464-validation
  cancel-in-progress: true
jobs:
  sample:
    if: github.event.pull_request.number == 503 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
        profile: [b10-o30, b15-o30, b10-o15, b15-o15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Measure fixed seed blocks
        env:
          COUNTER_CHUNK: ${{ matrix.chunk }}
          COUNTER_PROFILE: ${{ matrix.profile }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('balance/plans/counters-compressed.json','utf8'));
          const c=Number(process.env.COUNTER_CHUNK), profile=process.env.COUNTER_PROFILE;
          p.base['counters.compressed.brokenBase']=-Number(profile.match(/^b(\d+)/)[1])/1000;
          p.base['counters.compressed.offloadBase']=-Number(profile.match(/o(\d+)$/)[1])/1000;
          p.base['counters.compressed.expansive']=0.26;
          const names=['balanced v compressed','kick-chase v compressed','all-out v compressed','grind v compressed','expansive v compressed'];
          const main=structuredClone(p); main.name='Compressed 464 '+profile+' fresh part '+c; main.seeds=125; main.seedStart=1+c*125;
          main.scenarios=names.map(n=>structuredClone(p.scenarios.find(s=>s.name===n))); for(const s of main.scenarios)delete s.seeds;
          const extra=structuredClone(p);extra.name='Compressed 464 Rush extension part '+c;extra.seeds=125;extra.seedStart=501+c*125;extra.scenarios=[structuredClone(p.scenarios.find(s=>s.name==='balanced v rush'))];delete extra.scenarios[0].seeds;
          const legacy=structuredClone(main);legacy.name='Compressed 464 legacy control part '+c;legacy.scenarios=[structuredClone(p.scenarios.find(s=>s.name==='balanced v compressed'))];delete legacy.scenarios[0].seeds;
          legacy.base['counters.compressed.brokenBase']=-0.02;legacy.base['counters.compressed.offloadBase']=-0.03;
          fs.mkdirSync('work',{recursive:true});for(const [name,value]of Object.entries({main,extra,legacy}))fs.writeFileSync('work/counter464-'+name+'.json',JSON.stringify(value,null,2));
          NODE
          npm run balance -- --plan work/counter464-main.json --jobs 2 --out evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compressed-464-${{ matrix.profile }}-part-${{ matrix.chunk }}
          path: evidence/
          retention-days: 7
  matrix:
    needs: sample
    strategy:
      fail-fast: false
      matrix:
        profile: [b10-o30, b15-o30, b10-o15, b15-o15]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: compressed-464-${{ matrix.profile }}-part-*
          path: collected
          merge-multiple: true
      - run: scripts/balance-log.sh fetch
      - name: Assemble and check the full matrix
        env:
          COUNTER_PROFILE: ${{ matrix.profile }}
        run: |
          cat > .counter-464-pool.ts <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import cp from 'node:child_process';
          import {reportMarkdown} from './src/match/balance/report';
          import {COUNTERS} from './src/match/league/counters';
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const dirs=walk('collected').filter(f=>path.basename(f)==='plan.json').map(f=>path.dirname(f));
          const rowsOf=d=>fs.readdirSync(d).filter(f=>/^results(\.shard-\d+)?\.jsonl$/.test(f)).flatMap(f=>fs.readFileSync(path.join(d,f),'utf8').trim().split('\n').filter(Boolean).map(l=>JSON.parse(l)));
          const records=[];
          for(const d of dirs){const p=JSON.parse(fs.readFileSync(path.join(d,'plan.json'),'utf8'));for(const r of rowsOf(d))records.push({dir:d,start:p.seedStart??1,legacy:p.name.includes('legacy control'),row:r});}
          const stat=(ss,ns)=>{const n=ns.reduce((a,b)=>a+b,0),mean=ss.reduce((a,s,i)=>a+s.mean*ns[i],0)/n;const m2=ss.reduce((a,s,i)=>a+s.se*s.se*ns[i]*(ns[i]-1)+ns[i]*(s.mean-mean)**2,0);return{mean,se:Math.sqrt(m2/(n*(n-1)))}}; 
          const pool=(recs,end)=>{recs.sort((a,b)=>a.start-b.start);let next=1;for(const q of recs){if(q.start!==next)throw Error('Gap/overlap');next+=q.row.seeds;}if(next!==end+1)throw Error('Incomplete sample');
           const rs=recs.map(q=>q.row),ns=rs.map(r=>r.seeds),tn=rs.map(r=>r.trackedSeeds),n=ns.reduce((a,b)=>a+b,0),t=tn.reduce((a,b)=>a+b,0);
           const avg=(key,w)=>rs.reduce((a,r,i)=>a+r[key]*w[i],0)/w.reduce((a,b)=>a+b,0);
           const out={...rs[0],seeds:n,trackedSeeds:t,ms:rs.reduce((a,r)=>a+r.ms,0)};
           for(const key of ['counts','trackedCounts','opponentCounts'])out[key]=Object.fromEntries(Object.keys(rs[0][key]).map(k=>[k,stat(rs.map(r=>r[key][k]),key==='counts'?ns:tn)]));
           out.pointsShare=stat(rs.map(r=>r.pointsShare),tn);for(const k of ['homeWin','draw'])out[k]=avg(k,ns);for(const k of ['trackedWin','trackedDraw'])out[k]=avg(k,tn);
           const ww=rs.map(r=>r.counts.wrestles.mean*r.seeds);out.wrestleSecs=avg('wrestleSecs',ww);
           out.legs=rs[0].legs.map(l=>({minute:l.minute,home:rs.reduce((a,r,i)=>a+r.legs.find(x=>x.minute===l.minute).home*ns[i],0)/n,away:rs.reduce((a,r,i)=>a+r.legs.find(x=>x.minute===l.minute).away*ns[i],0)/n}));return out;};
          const groups=new Map();for(const q of records){const k=(q.legacy?'legacy:':'')+q.row.scenario;groups.set(k,[...(groups.get(k)??[]),q]);}
          const measured={};for(const [k,recs]of groups)measured[k]=pool(recs,k==='balanced v rush'?1000:500);
          const controls={
           'grind v slide':'20261104-173631-slide-grind-acceptance-pooled',
           'expansive v slide':'20261104-173632-slide-expansive-acceptance-pooled',
           'kick-chase v slide':'20261104-182658-slide-kick-chase-acceptance-pooled',
           'all-out v slide':'20261104-181028-slide-all-out-acceptance-pooled',
           'grind v rush':'20261104-204430-rush-tight-acceptance-pooled',
           'expansive v rush':'20261104-204431-rush-expansive-acceptance',
           'kick-chase v rush':'20261104-210843-rush-kick-chase-acceptance-pooled',
           'all-out v rush':'20261104-204432-rush-all-out-acceptance'};
          const sourceMap={};
          const previous='20261105-013647-compressed-464-final-matrix';
          for(const key of ['balanced v slide','balanced v rush'])controls[key]=previous;for(const [key,name]of Object.entries(controls)){const rs=rowsOf('.balance-log/runs/'+name).filter(r=>r.scenario===key&&r.variant==='baseline');if(rs.length!==1)throw Error('Missing control '+key);measured[key]=rs[0];sourceMap[key]='balance-log/runs/'+name;}
          const plan=JSON.parse(fs.readFileSync('balance/plans/counters-compressed.json','utf8'));plan.name='Compressed 464 '+process.env.COUNTER_PROFILE+' acceptance matrix';
          plan.base['counters.compressed.brokenBase']=-Number(process.env.COUNTER_PROFILE.match(/^b(\d+)/)[1])/1000;
          plan.base['counters.compressed.offloadBase']=-Number(process.env.COUNTER_PROFILE.match(/o(\d+)$/)[1])/1000;
          plan.base['counters.compressed.expansive']=0.26;
          const results=plan.scenarios.map(s=>{const r=measured[s.name];if(!r||r.trackedSeeds!==2*(s.seeds??plan.seeds))throw Error('Wrong sample '+s.name);return r;});
          const by=Object.fromEntries(results.map(r=>[r.scenario,r])),aa=['grind','expansive','kick-chase','all-out','balanced'],dd=['slide','rush','compressed'],swing=(a,d)=>(by[a+' v '+d].pointsShare.mean-.5)*100;
          const rowSums=Object.fromEntries(aa.map(a=>[a,dd.reduce((n,d)=>n+swing(a,d),0)])),columnSums=Object.fromEntries(dd.map(d=>[d,aa.reduce((n,a)=>n+swing(a,d),0)])),errors=[];
          for(const [a,[lo,hi]]of Object.entries({grind:[43,47],expansive:[53,57],balanced:[48,52],'kick-chase':[48,52],'all-out':[48,52]})){const pct=by[a+' v compressed'].pointsShare.mean*100;if(pct<lo-1e-9||pct>hi+1e-9)errors.push(a+' v Compressed '+pct+'% outside '+lo+'–'+hi);}
          for(const [k,v]of Object.entries({...rowSums,...columnSums}))if(Math.abs(v)>3+1e-9)errors.push(k+' sum '+v+' outside ±3');
          const stamp=new Date().toISOString().replace(/[-:]/g,'').replace('T','-').slice(0,15),dir='balance/runs/'+stamp+'-compressed-464-'+process.env.COUNTER_PROFILE+'-matrix';fs.mkdirSync(dir+'/inputs',{recursive:true});
          for(const d of dirs)fs.cpSync(d,dir+'/inputs/'+path.basename(d),{recursive:true});
          for(const name of new Set(Object.values(controls))){const src='.balance-log/runs/'+name,dst=dir+'/inputs/'+name;fs.mkdirSync(dst,{recursive:true});for(const f of fs.readdirSync(src)){const p=path.join(src,f);if(fs.statSync(p).isFile())fs.copyFileSync(p,path.join(dst,f));}}
          for(const r of results)if(!sourceMap[r.scenario])sourceMap[r.scenario]='fresh Actions checkpoints, seeds 1–'+r.seeds+' both ways';
          const legacy=JSON.parse(fs.readFileSync('.balance-log/runs/'+previous+'/legacy-control.json','utf8'));
          const meta={commit:cp.execFileSync('git',['rev-parse','--short','HEAD'],{encoding:'utf8'}).trim(),branch:'feat/464-compressed-counters',started:new Date().toISOString(),assembled:true,sourceMap,actionsRun:process.env.GITHUB_RUN_ID};
          const summary={runFolder:dir,commit:meta.commit,rowSums,columnSums,errors,cells:results.map(r=>({scenario:r.scenario,matches:r.trackedSeeds,share:r.pointsShare.mean,se:r.pointsShare.se})),legacy:legacy?.pointsShare};
          for(const [name,obj]of [['plan.json',plan],['meta.json',meta],['ACCEPTANCE.json',summary],['TUNED_VALUES.json',{shipped:COUNTERS,enabledOverrides:plan.base}]])fs.writeFileSync(dir+'/'+name,JSON.stringify(obj,null,2)+'\n');
          fs.writeFileSync(dir+'/results.jsonl',results.map(r=>JSON.stringify(r)).join('\n')+'\n');fs.writeFileSync(dir+'/report.md',reportMarkdown({plan,meta,results}));
          if(legacy)fs.writeFileSync(dir+'/legacy-control.json',JSON.stringify(legacy,null,2)+'\n');
          fs.writeFileSync(dir+'/PROVENANCE.md','# Acceptance provenance\n\nFresh official-harness checkpoints retain every seed 1–500 in both orientations for the five Compressed cells. Balanced/Slide (1000 matches) and Balanced/Rush (2000 matches) reuse the preceding unchanged final-range checkpoints from 20261105-013647-compressed-464-final-matrix. Every block has 125 seeds, played both ways. No seed/orientation is discarded. Source plans, metadata, reports and raw JSON are in inputs/.\n\nEight previously accepted non-balanced Slide/Rush controls and the two unchanged Balanced controls are reused from the balance-log runs listed in meta.json. Neither side has Compressed defence, so the new Compressed profile/counter cannot apply. Their active Tight/fit/Slide/Rush settings exactly match the final plan; changed inactive Compressed defaults cannot alter a replay. Tight/Rush retains all 2000 matches from its existing approved extension.\n\nThe legacy Compressed flat contact profile is a separate calibration control, never pooled into final acceptance. The enabled profile normalizes the flat baseline and localizes its Contact D-scaled middle advantage to Tight; neutral attacks still receive zero matchup-cell modifiers.\n\nPooling: M2_i=SE_i²×n_i×(n_i−1). With pooled mean m, M2=Σ[M2_i+n_i×(mean_i−m)²], SE=sqrt(M2/[N×(N−1)]). Tracked statistics use trackedSeeds; legacy counts use seeds. Rates/legs are match-weighted; wrestle seconds are weighted by wrestle counts. ms sums source cell wall times.\n\nThe committed full plan reproduces the complete consecutive ranges. All signed totals are checked unrounded in ACCEPTANCE.json.\n');
          console.log('ACCEPTANCE_JSON:'+JSON.stringify(summary));console.log(fs.readFileSync(dir+'/report.md','utf8'));
          for(const f of walk(dir)){const content=fs.readFileSync(f,'utf8'),rel=f.slice(dir.length+1),count=Math.ceil(content.length/3000);for(let i=0;i<count;i++)console.log('FILE_PART_JSON:'+JSON.stringify({path:rel,part:i,count,data:content.slice(i*3000,(i+1)*3000)}));}
          fs.writeFileSync('final-run-path.txt',dir+'\n');if(errors.length)process.exitCode=2;
          NODE
          npx vite-node .counter-464-pool.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compressed-464-${{ matrix.profile }}-matrix
          path: balance/runs/
          retention-days: 7
