name: Counters baseline-balanced candidate
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-baseline-candidate.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: slide-cell
            value: 0.35
            index: 0
          - kind: slide-cell
            value: 0.4
            index: 0
          - kind: slide-cell
            value: 0.45
            index: 0
          - kind: rush-cell
            value: 0.575
            index: 0
          - kind: rush-cell
            value: 0.6
            index: 0
          - kind: rush-cell
            value: 0.625
            index: 0
          - kind: compressed-cell
            value: 0.07
            index: 0
          - kind: compressed-cell
            value: 0.08
            index: 0
          - kind: compressed-cell
            value: 0.09
            index: 0
          - kind: full-fit
            value: 0
            index: 0
          - kind: full-fit
            value: 0
            index: 1
          - kind: full-fit
            value: 0
            index: 2
          - kind: full-fit
            value: 0
            index: 3
          - kind: full-fit
            value: 0
            index: 4
          - kind: full-fit
            value: 0
            index: 5
          - kind: full-fit
            value: 0
            index: 6
          - kind: full-fit
            value: 0
            index: 7
          - kind: fit-enabled
            value: 0
            index: 0
          - kind: fit-enabled
            value: 0
            index: 1
          - kind: fit-enabled
            value: 0
            index: 2
          - kind: fit-enabled
            value: 0
            index: 3
          - kind: fit-enabled
            value: 0
            index: 4
          - kind: strong-pack
            value: 0
            index: 0
          - kind: strong-pack
            value: 0
            index: 1
          - kind: strong-pack
            value: 0
            index: 2
          - kind: round-robin
            value: 0
            index: 0
          - kind: round-robin
            value: 0
            index: 1
          - kind: round-robin
            value: 0
            index: 2
          - kind: round-robin
            value: 0
            index: 3
          - kind: round-robin
            value: 0
            index: 4
          - kind: round-robin
            value: 0
            index: 5
          - kind: round-robin
            value: 0
            index: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          KIND: ${{ matrix.kind }}
          VALUE: ${{ matrix.value }}
          INDEX: ${{ matrix.index }}
        run: |
          python3 <<'PYCODE'
          import os,json
          from pathlib import Path
          kind=os.environ['KIND'];value=float(os.environ['VALUE']);i=int(os.environ['INDEX'])
          knobs={'presets.attack.kick-chase.base.pass':0,'counters.fit.edge':.065,'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.tight':.06,'counters.compressed.tightFit':1.5,'counters.compressed.expansive':.08,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          neutral=json.load(open('balance/plans/counters-enabled.json'))
          control=neutral['scenarios'][3].copy();control['seeds']=10
          if kind.endswith('-cell'):
            knob,fixture={'slide-cell':('counters.slide.kickChase','kick-chase v slide'),'rush-cell':('counters.rush.kickChase','kick-chase v rush'),'compressed-cell':('counters.compressed.expansive','expansive v compressed')}[kind]
            knobs[knob]=value
            p=dict(name=f'465 baseline-balanced {kind} {value}',description='Candidate-enabled cell versus recorded dormant main; intrinsic pass modifier changes use the existing roll. Flat control retained.',report='matrix',seeds=500,base=knobs,scenarios=[control,next(s for s in neutral['scenarios'] if s['name']==fixture)])
          else:
            source=json.load(open(f'balance/plans/counters-{kind}.json'))
            p=source.copy();p['name']+=f' / baseline-balanced {kind} {i}';p['base']={**source.get('base',{}),**knobs}
            p['scenarios']=([s for j,s in enumerate(source['scenarios']) if j%7==i] if kind=='round-robin' else [source['scenarios'][i]])
            if kind=='round-robin':p['seeds']=100
            if kind=='full-fit':
              # Isolate counter+fit with both independent baselines held on;
              # also retain the true main endpoint in the fully dormant row.
              p['variants']=[dict(v,tuning={**v['tuning'],**({'presets.attack.kick-chase.base.pass':-.05} if v['name']=='fully dormant' else {})}) for v in source['variants']]
            p['scenarios']=[control]+p['scenarios']
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-baseline-candidate.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-baseline-candidate.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: base-${{ matrix.kind }}-${{ matrix.value }}-${{ matrix.index }}
          path: |
            balance/runs
            balance.log
          retention-days: 7

  career:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        edge: [.055, .065, .075]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          EDGE: ${{ matrix.edge }}
        run: |
          python3 <<'PYCODE'
          import os,subprocess
          knobs={'presets.attack.kick-chase.base.pass':0,'counters.fit.edge':float(os.environ['EDGE']),'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.tight':.06,'counters.compressed.tightFit':1.5,'counters.compressed.expansive':.08,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          command=['npm','run','soak','--','--difficulties','normal','--managed-only','--jobs','4','--json','normal.json']
          for key,value in knobs.items():command+=['--tune',f'{key}={value}']
          subprocess.run(command,check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: base-career-${{ matrix.edge }}
          path: normal.json
          retention-days: 7
