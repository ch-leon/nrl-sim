name: Counters career fit calibration
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-career-calibration.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  normal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Normal managed comparison at reduced own-fit edge
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 <<'PY'
          import os, subprocess
          i=int(os.environ['PROFILE'])
          knobs={'counters.fit.edge':.075,'counters.slide.kickChase':.62,'counters.rush.kickChase':[.41,.43,.45][i],'counters.compressed.tightFit':1.5}
          profiles=[
            {'counters.compressed.commitM':8,'counters.compressed.tight':.04,'counters.compressed.expansive':.20},
            {'counters.compressed.commitM':10,'counters.compressed.tight':.06,'counters.compressed.expansive':.10,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0},
            {'counters.compressed.commitM':12,'counters.compressed.tight':.08,'counters.compressed.expansive':.05,'counters.compressed.brokenBase':.015,'counters.compressed.offloadBase':0},
          ]
          knobs.update(profiles[i])
          command=['npm','run','soak','--','--difficulties','normal','--managed-only','--jobs','4','--json','normal.json']
          for key,value in knobs.items(): command+=['--tune',f'{key}={value}']
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: career-profile-${{ matrix.profile }}
          path: normal.json
          retention-days: 7
