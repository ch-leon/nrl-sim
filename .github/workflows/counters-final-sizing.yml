name: Final counter size calibration

# Dedicated to #465 calibration. Each scenario gets its own runner, keeping the
# 1,000-match samples practical. Future use is manual; no other branch auto-runs it.
on:
  workflow_dispatch:
  push:
    branches: [issue-465-strategy-counters]
    paths:
      - '.github/workflows/counters-final-sizing.yml'
      - 'balance/plans/counters-final-sizing.json'

permissions:
  contents: read

concurrency:
  group: counter-final-size-${{ github.sha }}
  cancel-in-progress: true

jobs:
  fit:
    name: ${{ matrix.knob }} = ${{ matrix.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plan: final-sizing, cell: 0, knob: counters.slide.allOutRecovery, value: 0.5 }
          - { plan: final-sizing, cell: 0, knob: counters.slide.allOutRecovery, value: 1.0 }
          - { plan: final-sizing, cell: 0, knob: counters.slide.allOutRecovery, value: 1.5 }
          - { plan: final-sizing, cell: 1, knob: counters.rush.defenceFit, value: 0.025 }
          - { plan: final-sizing, cell: 1, knob: counters.rush.defenceFit, value: 0.030 }
          - { plan: final-sizing, cell: 1, knob: counters.rush.defenceFit, value: 0.035 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select the scenario without changing its samples or tuning
        env:
          PLAN: ${{ matrix.plan }}
          CELL: ${{ matrix.cell }}
          KNOB: ${{ matrix.knob }}
          VALUE: ${{ matrix.value }}
        run: |
          mkdir -p work
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync(`balance/plans/counters-${process.env.PLAN}.json`, 'utf8'));
          p.scenarios = Number(process.env.CELL) === 0 ? p.scenarios.slice(0, 1) : p.scenarios.slice(1);
          if (!p.scenarios.length) throw new Error('missing scenario');
          p.base[process.env.KNOB] = Number(process.env.VALUE);
          p.name += ` - ${process.env.KNOB} ${process.env.VALUE}`;
          writeFileSync('work/fit-plan.json', JSON.stringify(p, null, 2));
          JS
      - run: npm run balance -- --check --plan work/fit-plan.json
      - run: npm run balance -- --plan work/fit-plan.json --jobs 2 2>&1 | tee fit.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: counters-final-size-${{ matrix.cell }}-${{ matrix.value }}
          path: |
            balance/runs
            fit.log
          retention-days: 7
