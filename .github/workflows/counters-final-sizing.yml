name: Rush carry season parity calibration

# #465 only: diagnose the remaining Normal managed drift with the existing soak.
on:
  workflow_dispatch:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-final-sizing.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        carry: [0.00025, 0.0001]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git rev-parse HEAD > candidate-commit.txt
      - run: npm run soak -- --managed-only --difficulties normal --jobs 4 --tune counters.rush.carry=${{ matrix.carry }} --json soak-candidate.json 2>&1 | tee soak-candidate.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: counters-carry-${{ matrix.carry }}
          path: |
            candidate-commit.txt
            soak-candidate.json
            soak-candidate.log
          retention-days: 7
