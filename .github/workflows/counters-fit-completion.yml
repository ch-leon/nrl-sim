name: Counters fitted candidate completion
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-fit-completion.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: tight-neutral
            tight: 0.085
            index: 0
          - kind: tight-pack
            tight: 0.085
            index: 0
          - kind: tight-neutral
            tight: 0.09
            index: 0
          - kind: tight-pack
            tight: 0.09
            index: 0
          - kind: tight-neutral
            tight: 0.095
            index: 0
          - kind: tight-pack
            tight: 0.095
            index: 0
          - kind: full-fit
            tight: 0.085
            index: 0
          - kind: full-fit
            tight: 0.085
            index: 1
          - kind: full-fit
            tight: 0.085
            index: 2
          - kind: full-fit
            tight: 0.085
            index: 3
          - kind: full-fit
            tight: 0.085
            index: 4
          - kind: full-fit
            tight: 0.085
            index: 5
          - kind: full-fit
            tight: 0.085
            index: 6
          - kind: full-fit
            tight: 0.085
            index: 7
          - kind: own-fit
            tight: 0.085
            index: 0
          - kind: own-fit
            tight: 0.085
            index: 1
          - kind: own-fit
            tight: 0.085
            index: 2
          - kind: own-fit
            tight: 0.085
            index: 3
          - kind: own-fit
            tight: 0.085
            index: 4
          - kind: strong-pack
            tight: 0.085
            index: 0
          - kind: strong-pack
            tight: 0.085
            index: 1
          - kind: kc-slide-rr
            tight: 0.085
            index: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          KIND: ${{ matrix.kind }}
          TIGHT: ${{ matrix.tight }}
          INDEX: ${{ matrix.index }}
        run: |
          python3 <<'PYCODE'
          import json,os
          from pathlib import Path
          kind=os.environ['KIND']; tight=float(os.environ['TIGHT']); i=int(os.environ['INDEX'])
          base={'counters.fit.edge':.075,'counters.fit.counterResponse':.5,'counters.slide.kickChase':.62,'counters.rush.kickChase':.45,'counters.compressed.commitM':12,'counters.compressed.tight':tight,'counters.compressed.tightFit':1.5,'counters.compressed.expansive':.05,'counters.compressed.brokenBase':.015,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9}
          neutral=json.load(open('balance/plans/counters-enabled.json'))
          if kind=='tight-neutral': scenarios=[neutral['scenarios'][2]]
          elif kind=='tight-pack': scenarios=[json.load(open('balance/plans/counters-strong-pack.json'))['scenarios'][2]]
          elif kind=='strong-pack': scenarios=[json.load(open('balance/plans/counters-strong-pack.json'))['scenarios'][i]]
          elif kind=='full-fit':
            source=json.load(open('balance/plans/counters-full-fit.json')); scenarios=[source['scenarios'][i]]
          elif kind=='own-fit':
            source=json.load(open('balance/plans/counters-fit-enabled.json')); scenarios=[source['scenarios'][i]]
          else:
            source=json.load(open('balance/plans/counters-round-robin.json'))
            scenarios=[s for s in source['scenarios'] if 'kick-chase/slide' in s['name'].split(' v ')]
          seeds=100 if kind=='kc-slide-rr' else 500
          p=dict(name=f'465 fitted candidate {kind} {tight} {i}',description='Keep neutral targets and six strong-pack offloads with a shared unequal-fit response, lower own-fit edge and the Compressed round-robin candidate.',report='matrix',seeds=seeds,base=base,scenarios=scenarios)
          if kind=='own-fit':
            p['base']['counters.fit.on']=0
            p['variants']=[{'name':'enabled defaults','tuning':{'counters.fit.on':1}}]
          if kind=='full-fit' and i==0:
            p['base'].update({'counters.tight.on':1,'counters.fit.on':0,'counters.slide.on':0,'counters.rush.on':0,'counters.compressed.on':0})
            p['variants']=[{'name':'enabled defaults','tuning':{f'counters.{group}.on':1 for group in ['tight','fit','slide','rush','compressed']}}]
          control=neutral['scenarios'][3].copy();control['seeds']=10
          p['scenarios']=[control]+p['scenarios']
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-fit-completion.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-fit-completion.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fitted-${{ matrix.kind }}-${{ matrix.tight }}-${{ matrix.index }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
