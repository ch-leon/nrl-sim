name: Counter unequal fit calibration

# Dedicated to #465 calibration. Each scenario gets its own runner, keeping the
# 1,000-match samples practical. Future use is manual; no other branch auto-runs it.
on:
  workflow_dispatch:
  push:
    branches: [issue-465-strategy-counters]
    paths:
      - '.github/workflows/counters-fit-response.yml'
      - 'balance/plans/counters-fit-response.json'

permissions:
  contents: read

concurrency:
  group: counter-response-${{ github.sha }}
  cancel-in-progress: true

jobs:
  fit:
    name: ${{ matrix.knob }} = ${{ matrix.value }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plan: fit-response, cell: 0, knob: counters.slide.expansiveFit, value: 0.2 }
          - { plan: fit-response, cell: 0, knob: counters.slide.expansiveFit, value: 0.4 }
          - { plan: fit-response, cell: 0, knob: counters.slide.expansiveFit, value: 0.6 }
          - { plan: fit-response, cell: 2, knob: counters.slide.allOutFit, value: -0.2 }
          - { plan: fit-response, cell: 2, knob: counters.slide.allOutFit, value: -0.4 }
          - { plan: fit-response, cell: 2, knob: counters.slide.allOutFit, value: -0.6 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select the scenario without changing its samples or tuning
        env:
          PLAN: ${{ matrix.plan }}
          CELL: ${{ matrix.cell }}
          KNOB: ${{ matrix.knob }}
          VALUE: ${{ matrix.value }}
        run: |
          mkdir -p work
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync(`balance/plans/counters-${process.env.PLAN}.json`, 'utf8'));
          p.scenarios = p.scenarios.slice(Number(process.env.CELL), Number(process.env.CELL) + 1);
          if (p.scenarios.length !== 1) throw new Error('missing scenario');
          p.base[process.env.KNOB] = Number(process.env.VALUE);
          p.name += ` - ${process.env.KNOB} ${process.env.VALUE}`;
          writeFileSync('work/fit-plan.json', JSON.stringify(p, null, 2));
          JS
      - run: npm run balance -- --check --plan work/fit-plan.json
      - run: npm run balance -- --plan work/fit-plan.json --jobs 2 2>&1 | tee fit.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: counters-response-${{ matrix.cell }}-${{ matrix.value }}
          path: |
            balance/runs
            fit.log
          retention-days: 7
