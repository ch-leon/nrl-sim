name: Counters fitted middle recruitment
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-help-fit.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - response: 0.5
            fixture: full
          - response: 1
            fixture: full
          - response: 1.5
            fixture: full
          - response: 1.5
            fixture: pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          RESPONSE: ${{ matrix.response }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python3 <<'PY'
          import os,json
          from pathlib import Path
          r=float(os.environ['RESPONSE']);f=os.environ['FIXTURE']
          base={'presets.attack.kick-chase.base.pass':0,'counters.fit.edge':.065,'counters.fit.counterResponse':1.25,'counters.slide.kickChase':.4,'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.commitFit':r,'counters.compressed.tight':.06,'counters.compressed.tightFit':.6,'counters.compressed.expansive':.09,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          source=json.load(open('balance/plans/counters-full-fit.json' if f=='full' else 'balance/plans/counters-strong-pack.json'))
          scenario=source['scenarios'][4 if f=='full' else 2]
          control={'name':'balanced v slide','home':{'rating':60},'away':{'rating':60},'track':'home','bothWays':True,'seeds':10}
          p=dict(name=f'465 fitted middle reach {r} {f}',description='Defence-fit advantage extends existing middle recruitment; compare full Tight49.10% control, while strong-pack attack fit1.25vdefence1 has no extra reach.',report='matrix',seeds=500,base=base,scenarios=[control,scenario])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-help-fit.json').write_text(json.dumps(p,indent=2))
          PY
      - run: npm run balance -- --plan balance/plans/experiments/20261105-help-fit.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: help-fit-${{ matrix.response }}-${{ matrix.fixture }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
