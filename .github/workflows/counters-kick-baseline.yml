name: Counter switch-on Kick-chase baseline diagnostic
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-kick-baseline.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        early: [.65, .75, .85]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          EARLY: ${{ matrix.early }}
        run: |
          python3 <<'PY'
          import os,json
          from pathlib import Path
          source=json.load(open('balance/plans/counters-enabled.json'))
          fixture=next(s for s in source['scenarios'] if s['name']=='kick-chase v slide')
          control=source['scenarios'][3].copy();control['seeds']=10
          value=float(os.environ['EARLY'])
          base={f'counters.{g}.on':0 for g in ['tight','fit','slide','rush','compressed']}
          base['presets.attack.kick-chase.base.earlyKick']=value
          p=dict(name=f'465 dormant Kick-chase early-kick diagnostic {value}',description='Measure intrinsic Kick-chase balance using its existing early-kick roll; frozen main endpoint 52.75% is the unchanged comparison. No default changes.',report='matrix',seeds=500,base=base,scenarios=[control,fixture])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-kc-baseline.json').write_text(json.dumps(p,indent=2))
          PY
      - run: npm run balance -- --plan balance/plans/experiments/20261105-kc-baseline.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: kick-baseline-${{ matrix.early }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
