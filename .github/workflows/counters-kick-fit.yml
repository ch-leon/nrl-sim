name: Counters fitted kick cover and career parity
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-kick-fit.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        response: [.55, .6, .7, .75]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          RESPONSE: ${{ matrix.response }}
        run: |
          python3 <<'PY'
          import os,json
          from pathlib import Path
          r=float(os.environ['RESPONSE'])
          base={'presets.attack.kick-chase.base.pass':0,'counters.fit.edge':.065,'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.slide.kickChaseFit':r,'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.commitFit':1.5,'counters.compressed.tight':.06,'counters.compressed.tightFit':.6,'counters.compressed.expansive':.09,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          source=json.load(open('balance/plans/counters-full-fit.json'))
          control={'name':'balanced v slide','home':{'rating':60},'away':{'rating':60},'track':'home','bothWays':True,'seeds':10}
          p=dict(name=f'465 fitted kick cover {r}',description='Extra unequal-fit kick cover preserves the neutral matrix; compare the recorded pass-zero/fit-off50.40% control. No seed exclusions.',report='matrix',seeds=500,base=base,scenarios=[control,source['scenarios'][6]])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-kick-fit.json').write_text(json.dumps(p,indent=2))
          PY
      - run: npm run balance -- --plan balance/plans/experiments/20261105-kick-fit.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: kick-fit-${{ matrix.response }}
          path: |
            balance/runs
            balance.log
          retention-days: 7

  career:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        response: [.55, .6, .7, .75]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          RESPONSE: ${{ matrix.response }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 <<'PY'
          import os,subprocess
          knobs={'presets.attack.kick-chase.base.pass':0,'counters.fit.edge':.065,'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.slide.kickChaseFit':float(os.environ['RESPONSE']),'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.commitFit':1.5,'counters.compressed.tight':.06,'counters.compressed.tightFit':.6,'counters.compressed.expansive':.09,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          command=['npm','run','soak','--','--difficulties','normal','--managed-only','--jobs','4','--shard',os.environ['SHARD']+'/2','--json','normal.json']
          for key,value in knobs.items():command+=['--tune',f'{key}={value}']
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: kick-career-${{ matrix.response }}-${{ matrix.shard }}
          path: normal.json
          retention-days: 7
