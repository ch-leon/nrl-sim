name: Counters paired calibration
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-paired-calibration.yml']
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [0, 1, 2, 3, 4, 5, 6]
        candidate: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare paired neutral and full-fit candidate
        env:
          CELL: ${{ matrix.cell }}
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 <<'PYCODE'
          import json, os
          from pathlib import Path
          cells = [
            ('grind v slide', 'counters.slide.tight', [.015,.025,.035]),
            ('grind v compressed', 'counters.compressed.commitM', [8,10,12]),
            ('expansive v compressed', 'counters.compressed.expansive', [.15,.19,.22]),
            ('kick-chase v slide', 'counters.slide.kickChase', [.5,.7,.9]),
            ('kick-chase v rush', 'counters.rush.kickChase', [.55,.7,.85]),
            ('all-out v slide', 'counters.slide.allOut', [.8,1.1,1.4]),
            ('all-out v rush', 'counters.rush.allOut', [.10,.15,.20]),
          ]
          name,knob,values=cells[int(os.environ['CELL'])]
          value=values[int(os.environ['CANDIDATE'])]
          neutral=json.load(open('balance/plans/counters-enabled.json'))
          full=json.load(open('balance/plans/counters-full-fit.json'))
          scenario=next(x for x in neutral['scenarios'] if x['name']==name)
          fitted=next(x for x in full['scenarios'] if x['name']=='full fit '+name)
          control=next(x for x in neutral['scenarios'] if x['name']=='balanced v slide')
          control['seeds']=10
          p=dict(name=f'465 paired calibration {knob} {value}', description='Owner-approved paired neutral swings 4–6pp and full-fit at least 9pp. Flat control plus exact same-seed neutral/full-fit fixtures; unchanged dormant/comparator measurements are retained in the acceptance evidence.', report='matrix', seeds=500, base={knob:value}, scenarios=[control,scenario,fitted])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-paired.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-paired.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: paired-${{ matrix.cell }}-${{ matrix.candidate }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
