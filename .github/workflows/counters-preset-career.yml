name: Counters preset career parity
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-preset-career.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  career:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [0, 1, 2, 3]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 <<'PY'
          import os,subprocess
          knobs={'presets.attack.kick-chase.base.pass':[.02,.04,.06,.08][int(os.environ['PROFILE'])],'counters.fit.edge':.065,'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.slide.kickChaseFit':.7,'counters.rush.kickChase':.6,'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.commitFit':.5,'counters.compressed.tight':.06,'counters.compressed.tightFit':.6,'counters.compressed.expansive':.09,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          command=['npm','run','soak','--','--difficulties','normal','--managed-only','--jobs','4','--shard',os.environ['SHARD']+'/2','--json','normal.json']
          for key,value in knobs.items():command+=['--tune',f'{key}={value}']
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: preset-career-${{ matrix.profile }}-${{ matrix.shard }}
          path: normal.json
          retention-days: 7
