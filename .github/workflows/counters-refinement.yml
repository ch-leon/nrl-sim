name: Counters refinement and career pilot
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-refinement.yml']
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [0, 1, 2, 3, 4, 5]
        candidate: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare paired neutral and full-fit candidate
        env:
          CELL: ${{ matrix.cell }}
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 <<'PYCODE'
          import json, os
          from pathlib import Path
          index=int(os.environ['CELL'])
          neutral=json.load(open('balance/plans/counters-enabled.json'))
          full=json.load(open('balance/plans/counters-full-fit.json'))
          if index < 3:
            fixture='kick-chase v slide'; knob='counters.slide.kickChase'; value=[.6175,.62,.6225][index]
          else:
            fixture='kick-chase v rush'; knob='counters.rush.kickChase'; value=[.47,.49,.51][index-3]
          control=next(x for x in neutral['scenarios'] if x['name']=='balanced v slide'); control['seeds']=10
          scenarios=[control,next(x for x in neutral['scenarios'] if x['name']==fixture),next(x for x in full['scenarios'] if x['name']=='full fit '+fixture)]
          p=dict(name=f'465 refined calibration {knob} {value}',description='Bracket neutral counter size before confirming all-plan balance.',report='matrix',seeds=500,base={knob:value},scenarios=scenarios)
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-paired.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-paired.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: refine-${{ matrix.cell }}
          path: |
            balance/runs
            balance.log
          retention-days: 7

  round-robin-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 <<'PYCODE'
          import json,os
          from pathlib import Path
          i=int(os.environ['SHARD'])
          p=json.load(open('balance/plans/counters-round-robin.json'))
          p['name']+=f' / paired pilot shard {i}'
          p['seeds']=100
          p['scenarios']=[s for j,s in enumerate(p['scenarios']) if j%7==i]
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-pilot-rr.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-pilot-rr.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: paired-rr-pilot-${{ matrix.shard }}
          path: |
            balance/runs
            balance.log
          retention-days: 7

  normal-managed-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run soak -- --difficulties normal --managed-only --jobs 4 --json normal-managed.json 2>&1 | tee normal-managed.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: paired-normal-managed-pilot
          path: |
            normal-managed.json
            normal-managed.log
          retention-days: 7
