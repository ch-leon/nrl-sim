name: Counters remaining calibration
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-remaining-calibration.yml']
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [0, 1, 2, 3, 4, 5]
        candidate: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare paired neutral and full-fit candidate
        env:
          CELL: ${{ matrix.cell }}
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python3 <<'PYCODE'
          import json, os
          from pathlib import Path
          index=int(os.environ['CELL'])
          neutral=json.load(open('balance/plans/counters-enabled.json'))
          full=json.load(open('balance/plans/counters-full-fit.json'))
          base={'counters.slide.tight':.025,'counters.compressed.commitM':10,'counters.compressed.expansive':.19,'counters.rush.kickChase':.55,'counters.rush.allOut':.15}
          control=next(x for x in neutral['scenarios'] if x['name']=='balanced v slide')
          control['seeds']=10
          if index < 3:
            value=[.6,.625,.65][index]
            base['counters.slide.kickChase']=value
            name=f'kick chase slide {value}'
            scenarios=[control,next(x for x in neutral['scenarios'] if x['name']=='kick-chase v slide'),next(x for x in full['scenarios'] if x['name']=='full fit kick-chase v slide')]
          else:
            value=[8,10,12][index-3]
            base['counters.tight.offloadPerFit']=value
            name=f'strong pack compressed tight slope {value}'
            pack=json.load(open('balance/plans/counters-strong-pack.json'))
            scenarios=[control,next(x for x in pack['scenarios'] if x['name']=='strong pack Tight v compressed')]
          p=dict(name=f'465 remaining calibration {name}',description='Calibrate neutral/full Kick-chase Slide and retain six strong-pack offloads under the stronger Compressed counter.',report='matrix',seeds=500,base=base,scenarios=scenarios)
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-paired.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-paired.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: remaining-${{ matrix.cell }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
