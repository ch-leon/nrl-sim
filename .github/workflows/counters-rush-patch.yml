name: Counters Rush affected round robin
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-rush-patch.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [0, 1, 2, 3]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 <<'PYCODE'
          import os,json
          from pathlib import Path
          profile=int(os.environ['PROFILE']); i=int(os.environ['SHARD'])
          base={'presets.attack.kick-chase.base.pass':.04,'counters.fit.edge':.065,'counters.fit.counterResponse':1,'counters.slide.kickChase':.4,'counters.slide.kickChaseFit':.7,'counters.rush.kickChase':[.65,.7,.75,.8][profile],'counters.rush.allOut':.1,'counters.compressed.commitM':10,'counters.compressed.commitFit':.5,'counters.compressed.tight':.06,'counters.compressed.tightFit':.6,'counters.compressed.expansive':.09,'counters.compressed.brokenBase':0,'counters.compressed.offloadBase':0,'counters.tight.offloadPerFit':9.5}
          rr=json.load(open('balance/plans/counters-round-robin.json'))
          def affected(s):
            h=s['home']['tactics'];a=s['away']['tactics']
            return (h['attack']=='kick-chase' and a['defence']=='rush') or (a['attack']=='kick-chase' and h['defence']=='rush')
          rows=[s for s in rr['scenarios'] if affected(s)]
          assert len(rows)==14
          p=dict(name=f'465 Rush round-robin patch {profile} / shard {i}',description='Rerun every one of the fourteen pairs affected by changing the Rush Kick-chase cell. Pass weight .04; same 500 seeds both ways.',report='matrix',seeds=500,base=base,scenarios=[s for j,s in enumerate(rows) if j%4==i])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-preset-final.json').write_text(json.dumps(p,indent=2))
          PYCODE
      - run: npm run balance -- --plan balance/plans/experiments/20261105-preset-final.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rush-patch-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
