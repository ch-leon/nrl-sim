name: Counters final fit and career parity
on:
  push:
    branches: [issue-465-strategy-counters]
    paths: ['.github/workflows/counters-soak-fit-final.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  career:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        edge: [.05, .055, .06, .07]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run soak -- --difficulties easy,normal --managed-only --jobs 4 --shard ${{ matrix.shard }}/3 --tune counters.fit.edge=${{ matrix.edge }} --json careers.json 2>&1 | tee careers.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fit-careers-${{ matrix.edge }}-${{ matrix.shard }}
          path: |
            careers.json
            careers.log
          retention-days: 7
  full-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        edge: [.05, .055, .06, .07]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          EDGE: ${{ matrix.edge }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 <<'PY'
          import os,json
          from pathlib import Path
          edge=float(os.environ['EDGE']); i=int(os.environ['SHARD'])
          source=json.load(open('balance/plans/counters-full-fit.json'))
          p=dict(name=f'465 final own-fit edge {edge} shard {i}',description='Enabled full-fit cells, 1000 matches each. Compare the recorded fixed Tight-on and pass-.04/fit-off controls. Every500 consecutive seed retained both ways.',report='matrix',seeds=500,base={'counters.fit.edge':edge},scenarios=[s for j,s in enumerate(source['scenarios']) if j%4==i])
          Path('balance/plans/experiments').mkdir(exist_ok=True)
          Path('balance/plans/experiments/20261105-final-own-fit.json').write_text(json.dumps(p,indent=2))
          PY
      - run: npm run balance -- --plan balance/plans/experiments/20261105-final-own-fit.json --jobs 4 2>&1 | tee balance.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fit-cells-${{ matrix.edge }}-${{ matrix.shard }}
          path: |
            balance/runs
            balance.log
          retention-days: 7
