name: Matched dock projection performance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare control and candidate on the same runner in both orders
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          control=df55455ca1aab3ece3f4b60bbe2d51340ab04a57
          candidate=eeecde75dc73d608c7d105bfd4452f57dd9adb54
          files=(src/systems/leagueSeasonView.ts src/ui/hud.ts)
          test "$(git diff --name-only "$control" "$candidate")" = "$(printf '%s\n' "${files[@]}")"
          mkdir -p paired-perf
          for label in 0-warmup-control 1-control 2-candidate 3-candidate 4-control; do
            case "$label" in
              *control) sha="$control" ;;
              *) sha="$candidate" ;;
            esac
            for file in "${files[@]}"; do git show "$sha:$file" > "$file"; done
            status=0
            E2E_PORT="420${label:0:1}" E2E_OUT="paired-perf/$label" npm run e2e:perf -- --budget > "paired-perf/$label.log" 2>&1 || status=$?
            {
              echo "### $label ($sha, exit $status)"
              cat "paired-perf/$label/perf/report.md"
            } >> "$GITHUB_STEP_SUMMARY"
            sed -n '/| Budget /,$p' "paired-perf/$label/perf/report.md"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: matched-perf
          path: |
            paired-perf/*/perf/report.*
            paired-perf/*.log
