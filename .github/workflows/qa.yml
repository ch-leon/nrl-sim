name: QA

# The headless soak, the phone playthrough and the perf budget (docs/status/2026-10-qa.md,
# 2026-10-perf.md), nightly and on demand. Not on every PR: the playthrough takes
# minutes and drives a real Chromium. The runner's preinstalled Google Chrome is used
# (no browser download, never `playwright install`); the screenshots, report and save
# dumps are kept as an artifact for a week, and the summary shows on the run's page.
on:
  schedule:
    - cron: '20 16 * * *' # 02:20 AEST, after the day's merges
  workflow_dispatch:
    inputs:
      sizes:
        description: Playthrough sizes, space-separated (WxH)
        default: 844x390 1280x800
      only:
        description: Run one job only (qa = soak and playthroughs, perf = the budget)
        type: choice
        options: [all, qa, perf]
        default: all

permissions:
  contents: read

concurrency:
  group: qa
  cancel-in-progress: false

jobs:
  qa:
    if: ${{ inputs.only != 'perf' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every player match is a whole live match since BAK-207 Phase 4 (about 15 s a
      # season headless), so the nightly soak is 3 seasons × 10 seeds over every core.
      - name: Soak (3 seasons × 10 seeds, idle, managed, Hard, old saves)
        run: |
          npm run soak -- --seasons 3 --seeds 10 --jobs "$(nproc)" 2>&1 | tee soak.log
          {
            echo '## Soak'
            echo '```'
            tail -n 12 soak.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Playthrough (phone and desktop)
        if: ${{ !cancelled() }}
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SIZES: ${{ inputs.sizes || '844x390 1280x800' }}
        run: |
          status=0
          for size in $SIZES; do
            npm run e2e:season -- --size "$size" 2>&1 | tee "e2e-$size.log" || status=1
            {
              echo "## Playthrough $size"
              echo '```'
              tail -n 12 "e2e-$size.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Keep the screenshots, reports and save dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            e2e-output
            !e2e-output/dist
          retention-days: 7
          if-no-files-found: warn

  # N10 item 1 (#219): the phone performance budget as a gate. Its own runner, so the
  # timings are not taken on a machine still busy with the soak or a playthrough.
  # CPU throttled x4 at 844x390 (scripts/e2e-perf.mjs); a moment over its budget in
  # scripts/perf-budget.json fails this job. Nightly and on demand, not on PRs.
  perf:
    if: ${{ inputs.only != 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Perf budget (CPU x4, 844x390)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          status=0
          npm run e2e:perf -- --budget 2>&1 | tee perf.log || status=1
          {
            echo '## Perf budget'
            cat e2e-output/perf/report.md 2>/dev/null || tail -n 30 perf.log
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-perf
          path: |
            e2e-output/perf
          retention-days: 7
          if-no-files-found: warn
