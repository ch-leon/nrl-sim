name: Matched grounds performance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare control and candidate on the same runner in both orders
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          control=08bc90aaab29b322814431cfc3c37b856c320428
          candidate=221de8af1dea817e036566ba83c0e356372dce19
          scene=src/scenes/GroundsScene.ts
          test "$(git diff --name-only "$control" "$candidate")" = "$scene"
          mkdir -p paired-perf
          for label in 1-control 2-candidate 3-candidate 4-control; do
            case "$label" in
              *control) sha="$control" ;;
              *) sha="$candidate" ;;
            esac
            git show "$sha:$scene" > "$scene"
            status=0
            E2E_PORT="420${label:0:1}" E2E_OUT="paired-perf/$label" npm run e2e:perf -- --budget > "paired-perf/$label.log" 2>&1 || status=$?
            {
              echo "### $label ($sha, exit $status)"
              cat "paired-perf/$label/perf/report.md"
            } >> "$GITHUB_STEP_SUMMARY"
            sed -n '/| Budget /,$p' "paired-perf/$label/perf/report.md"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: matched-perf
          path: |
            paired-perf/*/perf/report.*
            paired-perf/*.log
