<!doctype html>
<html lang="en">
<head>

<title>Title · save slots · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}

.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.slot{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:14px;background:#0b1220;border:1px solid #222c45}
.lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8f98ab}
.more{width:40px;height:44px;border:0;border-radius:10px;background:#1a2540;color:#c8cdd8;font-size:16px}

<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>

<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #05070d; color: #ffffff; font-family: Inter, sans-serif; box-sizing: border-box; padding: 28px 40px; display: flex; gap: 40px">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px">
