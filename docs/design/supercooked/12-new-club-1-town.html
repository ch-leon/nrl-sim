<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New club · 1 Town · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.step{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:#8f98ab;background:#121a2e;border:1px solid #222c45}
.res{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;border:0;border-bottom:1px solid #1a2540;background:transparent;color:#ffffff;text-align:left;font-family:Inter,sans-serif}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #05070d; color: #ffffff; font-family: Inter, sans-serif; box-sizing: border-box; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<button style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 13px; font-weight: 700" class="h">◂ Back</button>
<span style="font-size: 20px; flex: 1" class="d">New club</span>
<nav style="display: flex; gap: 6px" aria-label="Steps">
<span style="background: #ffffff; color: #0b1220; border-color: #ffffff" aria-current="step" class="step">1 Town</span>
<span class="step">2 Club</span>
<span class="step">3 Start</span>
</nav>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px">
<span style="font-size: 30px; line-height: 1" class="d">Where's your club from?</span>
<span style="font-size: 14px; color: #c8cdd8">It names your club and ground. You can change both next.</span>
<div style="width: 520px; display: flex; flex-direction: column; margin-top: 4px">
<label style="position: absolute; left: -9999px" for="town">Home town</label>
<input style="height: 50px; border-radius: 12px 12px 0 0; border: 1px solid #ff6b1a; background: #121a2e; color: #ffffff; padding: 0 16px; font-family: Inter, sans-serif; font-size: 17px; box-sizing: border-box" value="Ipsw" id="town">
<div style="border: 1px solid #222c45; border-top: 0; border-radius: 0 0 12px 12px; background: #0b1220; overflow: hidden" aria-label="Towns" role="listbox">
<button style="background: #1a2540" class="res" aria-selected="true" role="option"><span style="flex: 1"><b>Ipsw</b>ich</span><span style="font-size: 12px; color: #c8cdd8">Queensland · Australia</span></button>
<button class="res" aria-selected="false" role="option"><span style="flex: 1"><b>Ipsw</b>ich</span><span style="font-size: 12px; color: #8f98ab">Suffolk · England</span></button>
<button style="border-bottom: 0" class="res" aria-selected="false" role="option"><span style="flex: 1"><b>Ipsw</b>ich</span><span style="font-size: 12px; color: #8f98ab">Massachusetts · USA</span></button>
</div>
<span style="font-size: 12px; color: #8f98ab; margin-top: 6px">Not listed? Type any name. It just won't be on the map.</span>
</div>
</div>
<div style="display: flex; justify-content: flex-end">
<button style="height: 50px; padding: 0 24px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 17px; font-weight: 700" class="h">Next ▸</button>
</div>
</div>

</body>
</html>
