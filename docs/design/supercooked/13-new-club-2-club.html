<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New club · 2 Club · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.step{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:#8f98ab;background:#121a2e;border:1px solid #222c45}
.lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8f98ab}
.in{height:42px;border-radius:10px;border:1px solid #2c3757;background:#121a2e;color:#ffffff;padding:0 12px;font-family:Inter,sans-serif;font-size:15px;box-sizing:border-box;width:100%}
.fld{display:flex;flex-direction:column;gap:4px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;display:block}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #05070d; color: #ffffff; font-family: Inter, sans-serif; box-sizing: border-box; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<button style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 13px; font-weight: 700" class="h">◂ Back</button>
<span style="font-size: 20px; flex: 1" class="d">New club</span>
<nav style="display: flex; gap: 6px" aria-label="Steps">
<span style="color: #14c38e" class="step">✓ Town</span>
<span style="background: #ffffff; color: #0b1220; border-color: #ffffff" aria-current="step" class="step">2 Club</span>
<span class="step">3 Start</span>
</nav>
</div>
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr); gap: 20px">
<div style="border-radius: 16px; background: #0b1220; border: 1px solid #222c45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px">
<svg height="120" width="120" shape-rendering="crispEdges" viewBox="0 0 16 16" aria-label="Your jersey: navy with an orange V" role="img"><rect fill="#0b1220" height="5" width="3" y="2" x="0" /><rect fill="#0b1220" height="5" width="3" y="2" x="13" /><rect fill="#0b1220" height="14" width="10" y="1" x="3" /><rect fill="#2c3757" height="0.4" width="3" y="2" x="0" /><rect fill="#2c3757" height="0.4" width="3" y="2" x="13" /><rect fill="#ff6b1a" height="1" width="4" y="1" x="6" /><rect fill="#ff6b1a" height="1" width="2" y="4" x="3" /><rect fill="#ff6b1a" height="1" width="2" y="4" x="11" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="4" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="10" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="5" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="9" /><rect fill="#ff6b1a" height="1" width="4" y="7" x="6" /><rect fill="#ff6b1a" height="1" width="3" y="6" x="0" /><rect fill="#ff6b1a" height="1" width="3" y="6" x="13" /></svg>
<span style="font-size: 16px; font-weight: 700; text-align: center" class="h">Ipswich Ironbarks</span>
<span style="font-size: 11px; color: #8f98ab">Colours are for looks only</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div class="fld"><label for="club" class="lab">CLUB NAME</label><input value="Ipswich Ironbarks" class="in" id="club"></div>
<div class="fld"><label for="ground" class="lab">GROUND</label><input value="Ipswich Oval" class="in" id="ground"></div>
<div class="fld"><label for="coach" class="lab">YOUR NAME</label><input value="Le" placeholder="Coach" class="in" id="coach"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="fld"><span class="lab">MAIN COLOUR</span><div style="display: grid; grid-template-columns: repeat(4, 32px); gap: 10px" aria-label="Main colour" role="radiogroup"><button style="background: #f4d03f" class="sw" aria-label="Gold" aria-checked="false" role="radio"></button><button style="background: #b3263a" class="sw" aria-label="Crimson" aria-checked="false" role="radio"></button><button style="background: #2f5fd0" class="sw" aria-label="Royal blue" aria-checked="false" role="radio"></button><button style="background: #ff6b1a" class="sw" aria-label="Orange" aria-checked="false" role="radio"></button><button style="background: #6b3fb0" class="sw" aria-label="Purple" aria-checked="false" role="radio"></button><button style="background: #14a3a3" class="sw" aria-label="Teal" aria-checked="false" role="radio"></button><button style="background: #ffffff" class="sw" aria-label="White" aria-checked="false" role="radio"></button><button style="background: #0b1220; border-color: #ffffff; box-shadow: 0 0 0 2px #ff6b1a" class="sw" aria-label="Navy-black" aria-checked="true" role="radio"></button></div></div>
<div class="fld"><span class="lab">SECOND COLOUR</span><div style="display: grid; grid-template-columns: repeat(4, 32px); gap: 10px" aria-label="Second colour" role="radiogroup"><button style="background: #ff6b1a; border-color: #ffffff; box-shadow: 0 0 0 2px #ff6b1a" class="sw" aria-label="Orange" aria-checked="true" role="radio"></button><button style="background: #ffffff" class="sw" aria-label="White" aria-checked="false" role="radio"></button><button style="background: #f4d03f" class="sw" aria-label="Gold" aria-checked="false" role="radio"></button><button style="background: #14a3a3" class="sw" aria-label="Teal" aria-checked="false" role="radio"></button><button style="background: #26325c; opacity: .3" class="sw" aria-label="Navy, too close to your main colour" aria-disabled="true" aria-checked="false" role="radio"></button><button style="background: #b3263a; opacity: .3" class="sw" aria-label="Crimson, a local club's colours" aria-disabled="true" aria-checked="false" role="radio"></button></div><span style="font-size: 11px; color: #8f98ab">Faded = too close, or a real local club's colours</span></div>
</div>
</div>
<div style="display: flex; justify-content: flex-end">
<button style="height: 50px; padding: 0 24px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 17px; font-weight: 700" class="h">Next ▸</button>
</div>
</div>

</body>
</html>
