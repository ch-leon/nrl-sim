<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New club · 3 Start · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.step{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:#8f98ab;background:#121a2e;border:1px solid #222c45}
.dif{flex:1;border-radius:14px;border:1px solid #2c3757;background:#121a2e;color:#ffffff;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-family:Inter,sans-serif;position:relative}
.dif .n{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:20px;letter-spacing:-0.01em}
.dif .t{font-size:12px;color:#c8cdd8;line-height:1.4}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #05070d; color: #ffffff; font-family: Inter, sans-serif; box-sizing: border-box; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<button style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 13px; font-weight: 700" class="h">◂ Back</button>
<span style="font-size: 20px; flex: 1" class="d">New club</span>
<nav style="display: flex; gap: 6px" aria-label="Steps">
<span style="color: #14c38e" class="step">✓ Town</span>
<span style="color: #14c38e" class="step">✓ Club</span>
<span style="background: #ffffff; color: #0b1220; border-color: #ffffff" aria-current="step" class="step">3 Start</span>
</nav>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: #0b1220; border: 1px solid #222c45">
<svg height="52" width="52" shape-rendering="crispEdges" viewBox="0 0 16 16" aria-hidden="true"><rect fill="#1a2540" height="5" width="3" y="2" x="0" /><rect fill="#1a2540" height="5" width="3" y="2" x="13" /><rect fill="#1a2540" height="14" width="10" y="1" x="3" /><rect fill="#ff6b1a" height="1" width="4" y="1" x="6" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="4" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="10" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="5" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="9" /><rect fill="#ff6b1a" height="1" width="4" y="7" x="6" /></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 700; letter-spacing: .03em" class="h">Ipswich Ironbarks</span><span style="font-size: 12px; color: #c8cdd8">Ipswich Oval · Queensland · Coach Le</span></span>
<button style="height: 36px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 12px" class="h">Edit</button>
</div>

<div style="display: flex; gap: 8px" aria-label="Difficulty" role="radiogroup">
<button style="border: 2px solid #ff6b1a" class="dif" aria-checked="true" role="radio"><span style="position: absolute; top: 10px; right: 10px; font-size: 9px; letter-spacing: .12em; padding: 3px 7px; border-radius: 9px; background: rgba(20,195,142,.14); color: #14c38e; border: 1px solid rgba(20,195,142,.45)" class="m">FIRST CAREER</span><span class="n">Easy</span><span class="t">More money, cheaper wages, rivals a step slower.</span></button>
<button class="dif" aria-checked="false" role="radio"><span class="n">Normal</span><span class="t">The game as it's meant to be played.</span></button>
<button class="dif" aria-checked="false" role="radio"><span class="n">Hard</span><span class="t">Less money, dearer wages, sharper rivals.</span></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto">
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #c8cdd8; min-height: 44px"><input style="width: 20px; height: 20px; accent-color: #ff6b1a" type="checkbox">I've played before: open every building and Office tile now</label>
<button style="height: 52px; padding: 0 26px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 18px; font-weight: 700" class="h">Start season ▸</button>
</div>
</div>

</body>
</html>
