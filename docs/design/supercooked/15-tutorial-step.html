<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial step · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.tile{min-height:66px;border-radius:12px;border:1px solid #222c45;background:#121a2e;color:#ffffff;text-align:left;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-family:Inter,sans-serif;box-sizing:border-box}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">

<section style="position: absolute; top: 12px; left: 12px; right: 12px; bottom: 88px; background: rgba(11,18,32,.98); border: 1px solid #222c45; border-radius: 16px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px" aria-label="Build">
<div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 22px" class="d">Build</span><span style="font-size: 13px; color: #c8cdd8">Pick one, then place it on the grounds</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="position: relative; z-index: 3; border: 2px solid #ff6b1a; box-shadow: 0 0 0 4px rgba(255,107,26,.25), 0 0 24px rgba(255,107,26,.35)" class="tile"><span style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 700" class="h">Training Paddock</span><span style="font-size: 12px; font-weight: 700; color: #ff6b1a" class="m">$8,000</span></span><span style="font-size: 12px; color: #c8cdd8">Players train a little faster</span><span style="font-size: 10px; color: #8f98ab" class="m">2×2</span></button>
<div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
</div>
</section>
<div style="position: absolute; inset: 0; background: rgba(5,7,13,.6); z-index: 2" aria-hidden="true"></div>

<div style="position: absolute; z-index: 4; top: 136px; left: 40px; width: 360px; background: #0b1220; border: 1px solid #222c45; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.45); padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px" aria-label="Tutorial, step 1 of 3" role="dialog">
<span style="position: absolute; top: -8px; left: 60px; width: 14px; height: 14px; background: #0b1220; border-left: 1px solid #222c45; border-top: 1px solid #222c45; transform: rotate(45deg)" aria-hidden="true"></span>
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; font-weight: 700; letter-spacing: .12em; color: #8f98ab" class="h">Your assistant</span><span style="font-size: 10px; padding: 3px 8px; border-radius: 10px; background: #1a2540; color: #c8cdd8" class="m">1 OF 3</span></div>
<span style="font-size: 16px; line-height: 1.4">Le, tap <span style="color: #ff6b1a; font-weight: 700">Training Paddock</span> to build one. Every player trains faster with it.</span>
<div style="display: flex; justify-content: flex-end"><button style="height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #c8cdd8; font-size: 13px; font-weight: 700" class="h">Skip tutorial</button></div>
</div>

<nav style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; background: rgba(5,7,13,.97); border: 1px solid #222c45; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 14px; box-sizing: border-box" aria-label="Club">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 12px; border-right: 1px solid #222c45; height: 36px">
<span style="font-size: 15px; font-weight: 700" class="m">$200,000</span>
<span style="font-size: 10px; letter-spacing: .12em; color: #8f98ab" class="m">CASH · PRE-SEASON</span>
</div>
<div style="display: flex; gap: 2px; flex: 1">
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Club</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Squad</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">League</button>
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ff6b1a; font-size: 15px; font-weight: 700; box-shadow: inset 0 -2px 0 #ff6b1a" aria-current="page" class="h">Build ▴</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Office</button>
</div>
<button style="height: 50px; padding: 0 16px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px" class="h"><span style="font-size: 18px; font-weight: 700; letter-spacing: .05em">Play week ▸</span><span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; color: #c8cdd8">Trial 1 · home</span></button>
</nav>
</div>

</body>
</html>
