<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building popup · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.pip{width:34px;height:8px;border-radius:4px;display:block}
.box{flex:1;background:#121a2e;border:1px solid #222c45;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; left: 150px; top: 110px; width: 170px; height: 120px; border: 2px dashed #ff6b1a; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255,107,26,.06)" aria-hidden="true"><span style="font-size: 10px; letter-spacing: .2em; color: #c8cdd8" class="m">WEIGHTS ROOM</span></div>

<section style="position: absolute; top: 12px; right: 12px; bottom: 88px; width: 330px; background: #0b1220; border: 1px solid #222c45; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.4); padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px" aria-label="Weights Room">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px; font-weight: 700; letter-spacing: .03em" class="h">Weights Room</span>
<button style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 14px" aria-label="Close">✕</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; gap: 4px" aria-label="Level 2 of 3" role="img"><span style="background: #ffffff" class="pip"></span><span style="background: #ffffff" class="pip"></span><span style="background: #26325c" class="pip"></span></span>
<span style="font-size: 12px; color: #c8cdd8" class="m">LEVEL 2 of 3</span>
</div>
<div style="display: flex; gap: 8px">
<div class="box"><span style="font-size: 10px; letter-spacing: .16em; color: #8f98ab" class="m">NOW</span><span style="font-size: 26px; line-height: 1" class="d">×1.6</span><span style="font-size: 12px; color: #c8cdd8">training boost for the squad</span></div>
<div style="border-color: rgba(20,195,142,.45)" class="box"><span style="font-size: 10px; letter-spacing: .16em; color: #14c38e" class="m">LEVEL 3</span><span style="font-size: 26px; line-height: 1; color: #14c38e" class="d">×2.2</span><span style="font-size: 12px; color: #c8cdd8">trains even faster</span></div>
</div>
<span style="font-size: 12px; color: #8f98ab">Upkeep <span style="color: #c8cdd8" class="m">$225/wk</span> on the salary cap · <span style="color: #c8cdd8" class="m">$300/wk</span> at L3</span>
<button style="margin-top: auto; height: 50px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 17px; font-weight: 700" class="h">Upgrade to L3 · <span style="font-weight: 700" class="m">$45,000</span></button>
<div style="display: flex; gap: 8px">
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 14px; font-weight: 700" class="h">Move · <span class="m">$2,500</span></button>
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: #1a2540; color: #ff8a3d; font-size: 14px; font-weight: 700" class="h">Demolish · <span class="m">+$9k</span></button>
</div>
</section>

<nav style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; background: rgba(5,7,13,.97); border: 1px solid #222c45; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 14px; box-sizing: border-box" aria-label="Club">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 12px; border-right: 1px solid #222c45; height: 36px">
<span style="font-size: 15px; font-weight: 700" class="m">$184,220</span>
<span style="font-size: 10px; letter-spacing: .12em; color: #8f98ab" class="m">CASH · WK 2/27</span>
</div>
<div style="display: flex; gap: 2px; flex: 1">
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ff6b1a; font-size: 15px; font-weight: 700; box-shadow: inset 0 -2px 0 #ff6b1a" aria-current="page" class="h">Club</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Squad</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">League</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Build</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px; display: flex; align-items: center; gap: 6px" aria-label="Office, 3 unread" class="h">Office<span style="width: 8px; height: 8px; border-radius: 50%; background: #ff3b1f" aria-hidden="true"></span></button>
</div>
<button style="height: 50px; padding: 0 16px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px" class="h"><span style="font-size: 18px; font-weight: 700; letter-spacing: .05em">Play week ▸</span><span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; color: #c8cdd8">v Darwin · away</span></button>
</nav>
</div>

</body>
</html>
