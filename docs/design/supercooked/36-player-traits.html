<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Traits · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.tile{background:#121a2e;border:1px solid #222c45;border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.trk{position:relative;height:6px;border-radius:3px;background:#1a2540}
.cap{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:rgba(255,255,255,.16)}
.fil{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:#ffffff}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:600;white-space:nowrap}
.good{background:rgba(20,195,142,.12);border:1px solid rgba(20,195,142,.45);color:#14c38e}
.dot{width:8px;height:8px;border-radius:50%;display:block}
.star{position:relative;color:#3a4566}
.star b{position:absolute;left:0;top:0;overflow:hidden;color:#ffffff;font-weight:inherit}
.sw{width:100%;height:48px;border-radius:12px;border:1px solid #222c45;background:#121a2e;color:#ffffff;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 14px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:16px;font-weight:600}
.knob{width:38px;height:22px;border-radius:11px;display:flex;align-items:center;padding:3px;box-sizing:border-box}
.knob span{width:16px;height:16px;border-radius:50%;display:block}
.pip{width:18px;height:6px;border-radius:3px;display:block}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">

<section style="position: absolute; top: 12px; left: 12px; right: 12px; bottom: 88px; background: #0b1220; border: 1px solid #222c45; border-radius: 16px; padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; overflow: hidden" aria-label="Ryan Calloway">

<div style="display: flex; align-items: center; gap: 14px; height: 44px">
<button style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 14px; font-weight: 700" class="h">◂ Squad</button>
<div style="flex: 1; min-width: 0">
<div style="font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .02em" class="h">Ryan Calloway</div>
<div style="font-size: 12px; color: #8f98ab; margin-top: 3px">Halfback · 24 · #7</div>
</div>
<span class="pill good"><span style="background: #14c38e" class="dot"></span>Fit 88%</span>
<span class="pill good"><span style="background: #14c38e" class="dot"></span>Happy</span>
<span style="display: flex; gap: 1px; font-size: 26px; line-height: 1; margin-left: 4px" aria-label="Rated 3 and a half stars out of 5" role="img">
<span aria-hidden="true" class="star">★<b style="width: 100%">★</b></span>
<span aria-hidden="true" class="star">★<b style="width: 100%">★</b></span>
<span aria-hidden="true" class="star">★<b style="width: 100%">★</b></span>
<span aria-hidden="true" class="star">★<b style="width: 50%">★</b></span>
<span aria-hidden="true" class="star">★</span>
</span>
</div>

<div style="display: flex; gap: 3px; background: #121a2e; border: 1px solid #222c45; border-radius: 10px; padding: 3px; align-self: flex-start" aria-label="Player" role="tablist">

<button style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; font-size: 15px; background: transparent; color: #c8cdd8" aria-selected="false" class="h" role="tab">Stats</button>

<button style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; font-size: 15px; background: #ffffff; color: #0b1220; font-weight: 700" aria-selected="true" class="h" role="tab">Traits</button>

<button style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; font-size: 15px; background: transparent; color: #c8cdd8" aria-selected="false" class="h" role="tab">Deal</button>

</div>




<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; flex: 1; align-content: start">
<div style="gap: 10px" class="tile">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 20px; font-weight: 700" class="h">Playmaker</span><span style="display: flex; gap: 4px" aria-label="Level 2 of 3" role="img"><span style="background: #ffffff" class="pip"></span><span style="background: #ffffff" class="pip"></span><span style="background: #26325c" class="pip"></span></span></div>
<span style="font-size: 14px; color: #e6e9ef; line-height: 1.45">Reads the shift. Passes more and throws the cut-out ball.</span>
<span style="font-size: 12px; color: #8f98ab; line-height: 1.4">On the pitch: a line through the man he skips.</span>
</div>
<div style="gap: 10px" class="tile">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 20px; font-weight: 700" class="h">Big Boot</span><span style="display: flex; gap: 4px" aria-label="Level 1 of 3" role="img"><span style="background: #ffffff" class="pip"></span><span style="background: #26325c" class="pip"></span><span style="background: #26325c" class="pip"></span></span></div>
<span style="font-size: 14px; color: #e6e9ef; line-height: 1.45">Kicks longer and more accurately.</span>
<span style="font-size: 12px; color: #8f98ab; line-height: 1.4">On the pitch: a longer, higher kick.</span>
</div>
</div>



</section>

<nav style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; background: rgba(5,7,13,.97); border: 1px solid #222c45; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 14px; box-sizing: border-box" aria-label="Club">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 12px; border-right: 1px solid #222c45; height: 36px">
<span style="font-size: 15px; font-weight: 700" class="m">$184,220</span>
<span style="font-size: 10px; letter-spacing: .12em; color: #8f98ab" class="m">WK 2/27 · S1</span>
</div>
<div style="display: flex; gap: 2px; flex: 1">
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Club</button>
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ff6b1a; font-size: 15px; font-weight: 700; box-shadow: inset 0 -2px 0 #ff6b1a" aria-current="page" class="h">Squad ▴</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">League</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Build</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px; display: flex; align-items: center; gap: 6px" aria-label="Office, 3 unread" class="h">Office<span style="width: 8px; height: 8px; border-radius: 50%; background: #ff3b1f" aria-hidden="true"></span></button>
</div>
<button style="height: 50px; padding: 0 16px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px" class="h"><span style="font-size: 18px; font-weight: 700; letter-spacing: .05em">Play week ▸</span><span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; color: #c8cdd8">v Darwin · away</span></button>
</nav>
</div>

</body>
</html>
