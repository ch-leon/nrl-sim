<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match · live · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.ctl{height:44px;min-width:44px;border:0;border-radius:10px;background:transparent;color:#c8cdd8;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:0 10px}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #17432c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 11px; letter-spacing: .3em; color: #5d8f73" class="m" aria-hidden="true">MATCH PITCH · GAME CANVAS</div>

<div style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="display: flex; align-items: stretch; height: 48px; border-radius: 12px; overflow: hidden; background: #05070d; border: 1px solid #222c45; box-shadow: 0 4px 14px rgba(0,0,0,.35)" aria-label="Score: Ipswich 12, Darwin 6, 34 minutes 12, first half" role="group">
<span style="width: 6px; background: #ff6b1a" aria-hidden="true"></span>
<span style="display: flex; align-items: center; padding: 0 10px 0 12px; font-size: 18px; font-weight: 700" class="h">IPS ★</span>
<span style="display: flex; align-items: center; padding: 0 12px; font-size: 26px; background: #121a2e" class="d">12</span>
<span style="display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 12px; gap: 1px"><span style="font-size: 15px; font-weight: 700" class="m">34:12</span><span style="font-size: 9px; letter-spacing: .14em; color: #8f98ab" class="m">1ST HALF</span></span>
<span style="display: flex; align-items: center; padding: 0 12px; font-size: 26px; background: #121a2e" class="d">6</span>
<span style="display: flex; align-items: center; padding: 0 12px 0 10px; font-size: 18px; font-weight: 700" class="h">DAR</span>
<span style="width: 6px; background: #14c38e" aria-hidden="true"></span>
</div>
<span style="height: 24px; padding: 0 12px; border-radius: 12px; background: rgba(5,7,13,.85); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .1em" class="h"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ff6b1a" aria-hidden="true"></span>Your ball · tackle 2</span>
<div style="margin-top: 6px; height: 52px; display: flex; align-items: stretch; border-radius: 12px; overflow: hidden; background: #05070d; box-shadow: 0 6px 20px rgba(0,0,0,.4)" role="status">
<span style="display: flex; align-items: center; padding: 0 16px; background: #ff6b1a; color: #0b1220; font-size: 30px; letter-spacing: -0.03em" class="d">Try</span>
<span style="display: flex; flex-direction: column; justify-content: center; padding: 0 16px 0 12px; gap: 1px"><span style="font-size: 19px; font-weight: 700; letter-spacing: .02em" class="h">J. Mere</span><span style="font-size: 11px; color: #c8cdd8" class="m">IPS · +4 · 2nd of the day</span></span>
</div>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 60px; border-radius: 16px; background: rgba(5,7,13,.95); border: 1px solid #222c45; display: flex; align-items: center; gap: 8px; padding: 0 8px; box-sizing: border-box">
<button style="height: 46px; padding: 0 16px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700" aria-label="Coach, 2 calls available" class="h">Coach<span style="height: 22px; min-width: 22px; padding: 0 6px; border-radius: 11px; background: #0b1220; color: #ff6b1a; font-size: 12px; display: flex; align-items: center; justify-content: center; box-sizing: border-box" class="m">2</span></button>
<button style="flex: 1; min-width: 0; height: 46px; border: 0; border-radius: 10px; background: #121a2e; color: #ffffff; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: Inter, sans-serif; text-align: left" aria-label="Open the match log">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #ff3b1f; flex: 0 0 auto" aria-hidden="true"></span>
<span style="flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hala hits the line, offload to Mere — he's away down the left</span>
<span style="font-size: 11px; color: #8f98ab; letter-spacing: .12em" class="h">Log ▴</span>
</button>
<div style="display: flex; align-items: center; gap: 2px; padding-left: 4px; border-left: 1px solid #222c45" aria-label="Match speed" role="group">
<button aria-label="Pause" class="ctl">❚❚</button>
<button style="background: #1a2540; color: #ffffff" aria-label="Speed 2 times, tap to change" class="ctl">2×</button>
<button style="font-family: Oswald, sans-serif; letter-spacing: .08em" class="ctl h">Skip ▸▸</button>
</div>
</div>
</div>

</body>
</html>
