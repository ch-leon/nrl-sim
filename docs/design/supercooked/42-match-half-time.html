<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match · half-time · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:12px}
.lbl{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700;color:#8f98ab}
.seg{display:flex;gap:3px;background:#121a2e;border:1px solid #222c45;border-radius:10px;padding:3px}
.seg button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;color:#c8cdd8;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:600}
.seg button.on{background:#ffffff;color:#0b1220;font-weight:700}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #17432c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(5,7,13,.55)" aria-hidden="true"></div>

<section style="position: absolute; left: 12px; right: 12px; bottom: 0; height: 330px; border-radius: 22px 22px 0 0; background: #0b1220; border: 1px solid #222c45; border-bottom: 0; box-shadow: 0 -8px 30px rgba(0,0,0,.4); padding: 16px 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px" aria-label="Half-time">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: baseline; gap: 14px"><span style="font-size: 26px; line-height: 1" class="d">Half-time</span><span style="font-size: 26px; line-height: 1; color: #c8cdd8" class="d">12–6</span><span style="font-size: 14px; color: #8f98ab">v Darwin</span></span>
<span style="font-size: 15px; color: #e6e9ef">Ahead, but they're rushing your halves. Go wide before the line gets there.</span>
</div>
<div style="flex: 0 0 auto; background: #121a2e; border: 1px solid #222c45; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 10px; letter-spacing: .16em; color: #8f98ab" class="m">DARWIN ARE</span>
<span style="font-size: 14px; font-weight: 700" class="h">Rushing up · Kicking early</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div class="row"><span class="lbl">Attack</span><div aria-label="Attack" role="radiogroup" class="seg"><button aria-checked="false" role="radio">Balanced</button><button class="on" aria-checked="true" role="radio">Expansive</button><button aria-checked="false" role="radio">Direct</button><button aria-checked="false" role="radio">Kick &amp; chase</button></div></div>
<div class="row"><span class="lbl">Defence</span><div aria-label="Defence" role="radiogroup" class="seg"><button class="on" aria-checked="true" role="radio">Hold</button><button aria-checked="false" role="radio">Rush</button><button aria-checked="false" role="radio">Slide</button></div></div>
<div class="row"><span class="lbl">Bench</span><div aria-label="Bench" role="radiogroup" class="seg"><button aria-checked="false" role="radio">Off</button><button class="on" aria-checked="true" role="radio">Standard</button><button aria-checked="false" role="radio">Heavy</button></div></div>
</div>

<div style="display: flex; align-items: center; gap: 14px; margin-top: auto">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 13px; color: #e6e9ef"><span style="font-size: 13px; font-weight: 700" class="h">Expansive:</span> more passes, more width. Spills a bit more.</span>
<span style="font-size: 12px; color: #8f98ab">Plays: Block play · Cut-out</span>
</div>
<button style="height: 50px; padding: 0 22px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 18px; font-weight: 700" class="h">Start 2nd half ▸</button>
</div>
</section>
</div>

</body>
</html>
