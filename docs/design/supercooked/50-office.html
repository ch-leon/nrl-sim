<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.tile{position:relative;height:58px;border-radius:12px;border:1px solid #222c45;background:#121a2e;color:#ffffff;text-align:left;padding:0 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;font-family:Inter,sans-serif}
.tile .n{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:16px;font-weight:700}
.tile .s{font-size:12px;color:#8f98ab}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(5,9,22,.5)" aria-hidden="true"></div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 84px; background: #0b1220; border: 1px solid #222c45; border-radius: 16px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4)" aria-label="Office" role="menu">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px"><span style="font-size: 20px" class="d">Office</span><span style="font-size: 12px; color: #8f98ab">Everything that isn't on the pitch</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">

<button aria-label="Finance, +$10.7k cash this week" class="tile" role="menuitem"><span class="n">Finance</span><span style="color: #14c38e; font-weight: 500" class="s">+$10.7k cash this week</span></button>

<button style="border-color: rgba(255,107,26,.5)" aria-label="Contracts, 2 end within 8 wks" class="tile" role="menuitem"><span class="n">Contracts</span><span style="color: #ff6b1a; font-weight: 700" class="s">2 end within 8 wks</span><span style="position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #ff6b1a" aria-hidden="true"></span></button>

<button aria-label="Staff & Board, Board patience 3/5" class="tile" role="menuitem"><span class="n">Staff &amp; Board</span><span style="color: #8f98ab; font-weight: 500" class="s">Board patience 3/5</span></button>

<button aria-label="Coach calls, 5 of 19 unlocked" class="tile" role="menuitem"><span class="n">Coach calls</span><span style="color: #8f98ab; font-weight: 500" class="s">5 of 19 unlocked</span></button>

<button aria-label="Playbook, 2 plays taken" class="tile" role="menuitem"><span class="n">Playbook</span><span style="color: #8f98ab; font-weight: 500" class="s">2 plays taken</span></button>

<button style="border-color: rgba(255,107,26,.5)" aria-label="News, 3 unread" class="tile" role="menuitem"><span class="n">News</span><span style="color: #ff6b1a; font-weight: 700" class="s">3 unread</span><span style="position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #ff6b1a" aria-hidden="true"></span></button>

<button aria-label="History, No seasons yet" class="tile" role="menuitem"><span class="n">History</span><span style="color: #8f98ab; font-weight: 500" class="s">No seasons yet</span></button>

<button aria-label="Kit & colours, Home · away" class="tile" role="menuitem"><span class="n">Kit &amp; colours</span><span style="color: #8f98ab; font-weight: 500" class="s">Home · away</span></button>

<button aria-label="Guide, How to play" class="tile" role="menuitem"><span class="n">Guide</span><span style="color: #8f98ab; font-weight: 500" class="s">How to play</span></button>

<button aria-label="Settings, Sound on" class="tile" role="menuitem"><span class="n">Settings</span><span style="color: #8f98ab; font-weight: 500" class="s">Sound on</span></button>

<button aria-label="Save & quit, Slot 1" class="tile" role="menuitem"><span class="n">Save &amp; quit</span><span style="color: #8f98ab; font-weight: 500" class="s">Slot 1</span></button>

</div>
</div>

<nav style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; background: rgba(5,7,13,.97); border: 1px solid #222c45; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 14px; box-sizing: border-box" aria-label="Club">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 12px; border-right: 1px solid #222c45; height: 36px">
<span style="font-size: 15px; font-weight: 700" class="m">$184,220</span>
<span style="font-size: 10px; letter-spacing: .12em; color: #8f98ab" class="m">CASH · WK 2/27</span>
</div>
<div style="display: flex; gap: 2px; flex: 1">
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Club</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Squad</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">League</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Build</button>
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ff6b1a; font-size: 15px; font-weight: 700; box-shadow: inset 0 -2px 0 #ff6b1a" aria-expanded="true" aria-current="page" class="h">Office ▴</button>
</div>
<button style="height: 50px; padding: 0 16px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px" class="h"><span style="font-size: 18px; font-weight: 700; letter-spacing: .05em">Play week ▸</span><span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500">v Darwin · away</span></button>
</nav>
</div>

</body>
</html>
