<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit & colours · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8f98ab}
.pat{height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#c8cdd8;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;display:block}
.row{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:10px}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">

<section style="position: absolute; top: 12px; left: 12px; right: 12px; bottom: 88px; background: #0b1220; border: 1px solid #222c45; border-radius: 16px; padding: 12px 16px; box-sizing: border-box; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; overflow: hidden" aria-label="Kit and colours">
<div style="display: flex; flex-direction: column; gap: 8px; min-height: 0">
<div style="display: flex; align-items: center; gap: 10px"><button style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: #1a2540; color: #ffffff; font-size: 13px; font-weight: 700" class="h">◂ Office</button><span style="font-size: 20px" class="d">Kit</span></div>
<div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<div style="border-radius: 14px; background: #121a2e; border: 1px solid #222c45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg height="96" width="96" shape-rendering="crispEdges" viewBox="0 0 16 16" aria-label="Home kit: navy with an orange V" role="img"><rect fill="#05070d" height="5" width="3" y="2" x="0" /><rect fill="#05070d" height="5" width="3" y="2" x="13" /><rect fill="#05070d" height="14" width="10" y="1" x="3" /><rect fill="#ff6b1a" height="1" width="3" y="6" x="0" /><rect fill="#ff6b1a" height="1" width="3" y="6" x="13" /><rect fill="#ff6b1a" height="1" width="4" y="1" x="6" /><rect fill="#ff6b1a" height="1" width="2" y="4" x="3" /><rect fill="#ff6b1a" height="1" width="2" y="4" x="11" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="4" /><rect fill="#ff6b1a" height="1" width="2" y="5" x="10" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="5" /><rect fill="#ff6b1a" height="1" width="2" y="6" x="9" /><rect fill="#ff6b1a" height="1" width="4" y="7" x="6" /></svg>
<span class="lab">HOME</span>
</div>
<div style="border-radius: 14px; background: #121a2e; border: 1px solid #222c45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg height="96" width="96" shape-rendering="crispEdges" viewBox="0 0 16 16" aria-label="Alternate kit: white with navy hoops" role="img"><rect fill="#f3ead0" height="5" width="3" y="2" x="0" /><rect fill="#f3ead0" height="5" width="3" y="2" x="13" /><rect fill="#f3ead0" height="14" width="10" y="1" x="3" /><rect fill="#0b1220" height="1" width="4" y="1" x="6" /><rect fill="#0b1220" height="2" width="10" y="6" x="3" /><rect fill="#0b1220" height="2" width="10" y="10" x="3" /><rect fill="#0b1220" height="1" width="3" y="6" x="0" /><rect fill="#0b1220" height="1" width="3" y="6" x="13" /></svg>
<span class="lab">AWAY</span>
</div>
</div>
<span style="font-size: 11px; color: #8f98ab">Looks only. Kits never change how a match plays.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="clubname" class="lab">CLUB NAME</label>
<div style="display: flex; gap: 8px"><input style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #2c3757; background: #121a2e; color: #ffffff; padding: 0 12px; font-family: Inter, sans-serif; font-size: 15px; box-sizing: border-box" value="Ipswich Ironbarks" id="clubname"><button style="height: 40px; padding: 0 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; background: transparent; color: #ffffff; font-size: 13px; font-weight: 700" class="h">Rename</button></div>
</div>
<span style="font-size: 14px; font-weight: 700; margin-top: 2px" class="h">Home kit</span>
<div class="row"><span class="lab">PATTERN</span><div style="display: flex; gap: 2px; background: #121a2e; border: 1px solid #222c45; border-radius: 10px; padding: 2px; align-self: flex-start; width: max-content" aria-label="Home pattern" role="radiogroup"><button class="pat" aria-checked="false" role="radio">Plain</button><button style="background: #ffffff; color: #0b1220; font-weight: 700" class="pat" aria-checked="true" role="radio">V</button><button class="pat" aria-checked="false" role="radio">Hoops</button><button class="pat" aria-checked="false" role="radio">Sleeves</button><button class="pat" aria-checked="false" role="radio">Stripes</button></div></div>
<div class="row"><span class="lab">TRIM</span><div style="display: flex; gap: 8px" aria-label="Home trim" role="radiogroup"><button style="background: #ff6b1a; border-color: #ffffff; box-shadow: 0 0 0 2px #0b1220 inset" class="sw" aria-label="Orange" aria-checked="true" role="radio"></button><button style="background: #ffffff" class="sw" aria-label="White" aria-checked="false" role="radio"></button><button style="background: #f4d03f" class="sw" aria-label="Gold" aria-checked="false" role="radio"></button><button style="background: #14c38e" class="sw" aria-label="Teal" aria-checked="false" role="radio"></button></div></div>
<span style="font-size: 14px; font-weight: 700; margin-top: 2px" class="h">Away kit <span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 400; color: #8f98ab">· worn when colours clash</span></span>
<div class="row"><span class="lab">JERSEY</span><div style="display: flex; gap: 8px" aria-label="Away jersey" role="radiogroup"><button style="background: #f3ead0; border-color: #ff6b1a" class="sw" aria-label="Cream" aria-checked="true" role="radio"></button><button style="background: #2f5fd0" class="sw" aria-label="Royal blue" aria-checked="false" role="radio"></button><button style="background: #b3263a" class="sw" aria-label="Crimson" aria-checked="false" role="radio"></button><button style="background: #6b3fb0" class="sw" aria-label="Purple" aria-checked="false" role="radio"></button></div></div>
<div style="display: flex; gap: 8px; margin-top: auto; justify-content: flex-end">
<button style="height: 44px; padding: 0 16px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; background: transparent; color: #ffffff; font-size: 14px; font-weight: 700" class="h">Club default</button>
<button style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 15px; font-weight: 700" class="h">Save kit</button>
</div>
</div>
</section>

<nav style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; background: rgba(5,7,13,.97); border: 1px solid #222c45; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 7px 0 14px; box-sizing: border-box" aria-label="Club">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-right: 12px; border-right: 1px solid #222c45; height: 36px">
<span style="font-size: 15px; font-weight: 700" class="m">$184,220</span>
<span style="font-size: 10px; letter-spacing: .12em; color: #8f98ab" class="m">CASH · WK 2/27</span>
</div>
<div style="display: flex; gap: 2px; flex: 1">
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Club</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Squad</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">League</button>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #c8cdd8; font-size: 15px" class="h">Build</button>
<button style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #1a2540; color: #ff6b1a; font-size: 15px; font-weight: 700; box-shadow: inset 0 -2px 0 #ff6b1a" aria-current="page" class="h">Office</button>
</div>
<button style="height: 50px; padding: 0 16px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px" class="h"><span style="font-size: 18px; font-weight: 700; letter-spacing: .05em">Play week ▸</span><span style="font-family: Inter, sans-serif; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; color: #c8cdd8">v Darwin · away</span></button>
</nav>
</div>

</body>
</html>
