<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.ch{flex:1;min-width:0;border-radius:14px;border:1px solid #2c3757;background:#121a2e;color:#ffffff;text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-family:Inter,sans-serif}
.ch .n{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:17px;font-weight:700}
.pl{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;align-self:flex-start}
.sure{background:rgba(20,195,142,.12);color:#14c38e;border:1px solid rgba(20,195,142,.4)}
.neu{background:#1a2540;color:#c8cdd8;border:1px solid #2c3757}
.risk{background:rgba(255,138,61,.12);color:#ff8a3d;border:1px solid rgba(255,138,61,.4)}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(5,7,13,.6)" aria-hidden="true"></div>

<section style="position: absolute; top: 16px; left: 102px; width: 640px; bottom: 16px; background: #0b1220; border: 1px solid #222c45; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px" aria-label="Decision 1 of 2: Sponsor offer" role="dialog">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 11px; letter-spacing: .2em; color: #8f98ab" class="m">DECISION · 1 OF 2</span>
<button style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 14px" aria-label="Close">✕</button>
</div>
<span style="font-size: 28px; line-height: 1" class="d">Sponsor offer</span>
<span style="font-size: 12px; color: #8f98ab">S1 · Week 2 · answer within 1 week, or it's "Say no"</span>
<span style="font-size: 15px; line-height: 1.45; color: #e6e9ef">A local car yard wants its name across your sleeve. Easy money now. The board thinks it looks cheap.</span>
<span style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #c8cdd8"><span style="font-size: 11px; font-weight: 700; color: #0b1220; background: #c8cdd8; border-radius: 6px; padding: 2px 6px; flex: 0 0 auto" class="h">Coach</span><span style="font-style: italic">"Take the money. Nobody reads sleeves."</span></span>
<div style="display: flex; gap: 8px; margin-top: auto">
<button class="ch"><span class="n">Sign it</span><span class="pl sure">Sure: +$15,000</span><span class="pl risk">20% risk: board patience −1</span></button>
<button class="ch"><span class="n">Haggle</span><span class="pl sure">Sure: +$22,000 if they agree</span><span class="pl risk">40% risk: they walk</span></button>
<button class="ch"><span class="n">Say no</span><span class="pl neu">Nothing changes</span></button>
</div>
</section>
</div>

</body>
</html>
