<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.sw{width:100%;min-height:46px;border:0;border-bottom:1px solid #1a2540;background:transparent;color:#ffffff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0;text-align:left;font-family:Inter,sans-serif}
.sw .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.sw .t b{font-size:14px;font-weight:600}
.sw .t i{font-style:normal;font-size:11px;color:#8f98ab}
.knob{width:38px;height:22px;border-radius:11px;display:flex;align-items:center;padding:3px;box-sizing:border-box;flex:0 0 auto}
.knob span{width:16px;height:16px;border-radius:50%;display:block}
.lab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#8f98ab}
.tool{height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.3);border-radius:10px;background:transparent;color:#ffffff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:700}
.ts{flex:1;height:34px;border:0;border-radius:8px;background:transparent;color:#c8cdd8;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
</style>
<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #10261c; color: #ffffff; font-family: Inter, sans-serif">
<div style="position: absolute; inset: 0; background: rgba(5,7,13,.6)" aria-hidden="true"></div>

<section style="position: absolute; inset: 12px; background: #0b1220; border: 1px solid #222c45; border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 12px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px" aria-label="Settings" role="dialog">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 22px" class="d">Settings</span>
<button style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #1a2540; color: #ffffff; font-size: 14px" aria-label="Close">✕</button>
</div>
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
<div style="display: flex; flex-direction: column; min-height: 0">
<div style="display: flex; align-items: center; gap: 12px; min-height: 42px; border-bottom: 1px solid #1a2540"><span style="font-size: 14px; font-weight: 600; width: 60px">Volume</span><span style="flex: 1; height: 6px; border-radius: 3px; background: #1a2540; position: relative" aria-hidden="true"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; border-radius: 3px; background: #ffffff"></span><span style="position: absolute; left: calc(70% - 9px); top: -6px; width: 18px; height: 18px; border-radius: 50%; background: #ffffff"></span></span><span style="font-size: 12px; color: #c8cdd8" class="m">70</span></div>
<button aria-checked="false" role="switch" class="sw"><span class="t"><b>Mute</b></span><span style="background: #26325c; justify-content: flex-start" class="knob"><span style="background: #8f98ab"></span></span></button>
<button aria-checked="true" role="switch" class="sw"><span class="t"><b>Coach calls</b><i>Nudge your side mid-match: hit-up, shift, kick early…</i></span><span style="background: #ff6b1a; justify-content: flex-end" class="knob"><span style="background: #0b1220"></span></span></button>
<button aria-checked="false" role="switch" class="sw"><span class="t"><b>Play out rival matches</b><i>Real stats for every result. Slower weeks on a phone.</i></span><span style="background: #26325c; justify-content: flex-start" class="knob"><span style="background: #8f98ab"></span></span></button>
<button style="border-bottom: 0" aria-checked="true" role="switch" class="sw"><span class="t"><b>Slow down for big moments</b><i>Line breaks, tries and the last two minutes</i></span><span style="background: #ff6b1a; justify-content: flex-end" class="knob"><span style="background: #0b1220"></span></span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-height: 0">
<span class="lab">TEXT SIZE</span>
<div style="display: flex; gap: 2px; background: #121a2e; border: 1px solid #222c45; border-radius: 10px; padding: 2px" aria-label="Text size" role="radiogroup"><button style="background: #ffffff; color: #0b1220; font-weight: 700; font-size: 13px" class="ts" aria-checked="true" role="radio">Normal</button><button style="font-size: 15px" class="ts" aria-checked="false" role="radio">Large</button><button style="font-size: 17px" class="ts" aria-checked="false" role="radio">Larger</button></div>
<button aria-checked="true" role="switch" class="sw"><span class="t"><b>Weekly summary</b><i>Training, injuries, money and the board after each week</i></span><span style="background: #ff6b1a; justify-content: flex-end" class="knob"><span style="background: #0b1220"></span></span></button>
<span style="margin-top: 2px" class="lab">YOUR SAVE</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><button class="tool">Export save</button><button class="tool">Import save…</button><button class="tool">Replay tutorial</button></div>
<span style="margin-top: auto; font-size: 11px; color: #8f98ab">Not affiliated with or endorsed by the NRL, its clubs or players.</span>
</div>
</div>
</section>
</div>

</body>
</html>
