<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Sacked · Big Coach mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
.d{font-family:'Archivo Black',sans-serif;text-transform:uppercase;letter-spacing:-0.02em}
.h{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.m{font-family:'JetBrains Mono',monospace}
button{cursor:pointer}
a{color:#ff8a3d}a:hover{color:#ffb27a}
.c{flex:1;background:#121a2e;border:1px solid #222c45;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}

<style>html,body{background:#05070d}body{min-height:100vh;display:flex;align-items:center;justify-content:center}</style>

<body>
<!-- Static mockup exported from the Big Coach × SuperCOOKED design canvas. Data is placeholder. 844×390 -->


<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: #05070d; color: #ffffff; font-family: Inter, sans-serif">
<section style="position: absolute; top: 20px; bottom: 20px; left: 152px; width: 540px; background: #0b1220; border: 1px solid rgba(255,59,31,.45); border-radius: 18px; padding: 18px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px" aria-label="You have been sacked" role="alertdialog">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; font-weight: 700; padding: 4px 9px; border-radius: 10px; background: rgba(255,59,31,.15); border: 1px solid rgba(255,59,31,.5); color: #ff6a52">SACKED · END OF SEASON 3</span>
<span style="font-size: 46px; line-height: .95" class="d">You're <span style="color: #ff6b1a">cooked.</span></span>
<span style="font-size: 15px; color: #e6e9ef; line-height: 1.45">Ipswich Ironbarks have let you go. Two seasons outside the top four ran the board out of patience.</span>
<div style="display: flex; gap: 6px">
<div class="c"><span>SEASONS</span><span style="font-size: 20px" class="d">3</span></div>
<div class="c"><span>TITLES</span><span style="font-size: 20px" class="d">0</span></div>
<div class="c"><span>BEST</span><span style="font-size: 20px" class="d">3rd</span></div>
<div class="c"><span>REP</span><span style="font-size: 20px" class="d">34</span></div>
</div>
<span style="font-size: 12px; color: #8f98ab">Your save in slot 1 is kept. Start a new club in any slot.</span>
<button style="margin-top: auto; height: 50px; border: 0; border-radius: 10px; background: #ff6b1a; color: #0b1220; font-size: 17px; font-weight: 700" class="h">New club ▸</button>
</section>
</div>
