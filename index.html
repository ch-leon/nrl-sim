<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NRL Sim</title>
    <!-- PWA (BAK-204): theme + iOS install/standalone hints. The manifest link
         and SW registration are auto-injected by vite-plugin-pwa. -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NRL Sim" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a2e; }
      * { image-rendering: pixelated; font-family: "Courier New", monospace; }
      #game-root, #ui-root { position: absolute; inset: 0; }
      /* UI overlay must not steal world pointer input; children opt back in. */
      #ui-root { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
