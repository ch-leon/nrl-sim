<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- #206: maximum-scale stops iOS Safari keeping a portrait-width layout zoomed
         (956/440 = 2.17× on a 16 Pro Max) after the phone is turned sideways. iOS
         still lets the player pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>NRL Sim</title>
    <!-- PWA (BAK-204): theme + iOS install/standalone hints. The manifest link
         and SW registration are auto-injected by vite-plugin-pwa. -->
    <meta name="theme-color" content="#0e1630" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NRL Sim" />
    <!-- Generated by scripts/gen-icons.mjs (predev/prebuild); also stops the
         browser's default /favicon.ico request 404ing. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      /* #206: iOS Safari boosts text in landscape (text-size-adjust: auto) by up to
         its landscape/portrait width ratio, 2.17× on a 16 Pro Max; the DOM overlay is
         laid out for the authored sizes, so keep them. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { margin: 0; height: 100%; background: #0e1630; overflow: hidden; overscroll-behavior: none; }
      /* Broadcast Quiet: Plex Sans for body text; labels and numbers set their own (src/ui/dom.ts). */
      body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
      img, canvas { image-rendering: pixelated; }
      #game-root, #ui-root { position: absolute; inset: 0; }
      #game-root canvas { display: block; touch-action: none; }
      /* UI overlay must not steal world pointer input; children opt back in. */
      #ui-root { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
